services:
  jo-sim:
    build:
      network: host
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_RTABMAP: ${BUILD_RTABMAP:-false}
        GLIM_ROS_REF: ${GLIM_ROS_REF:-dev}
        DENDROS_VERSION: ${DENDROS_VERSION:-latest}
        BUILD_JOBS: ${BUILD_JOBS:-8}
        CUDA_ARCHS: ${CUDA_ARCHS:-all-major}
    privileged: true
    image: jo-sim
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:ro
      - /dev:/dev
      - ./jo_description:/home/ros/src/jo_description
      - ./jo_navigation:/home/ros/src/jo_navigation
      - ./jo_sim:/home/ros/src/jo_sim
      - ./docker/utils:/home/ros/utils
      - ./user_worlds:/home/ros/user_worlds
      - ./saved_maps:/saved_maps
      - ./bags:/home/ros/bags
      # glim_ros2 development: uncomment and set EXTRA_BUILD_PACKAGES=glim_ros in .env
      # - ${GLIM_ROS_DEV_PATH:-~/glim_ros2}:/home/ros/src/glim_ros2
    env_file:
      - .env
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,display,video,utility,compute
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///home/ros/utils/cyclonedds.xml
      - XAUTHORITY=/tmp/.Xauthority
      - RCUTILS_COLORIZED_OUTPUT=1
      - JO_SIM_WORLDS=/home/ros/user_worlds
    group_add:
      - dialout

    command: bash
